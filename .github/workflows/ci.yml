name: larvitorder CI

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    # Set DB settings in both env variables and db_test.json (below)
    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: test
      DB_PORT: 3306
      DB_DATABASE: test

    strategy:
      # Mocha 12 needs require(esm): Node ^20.19.0 || >=22.12.0.
      # The shared larvit test workflow is pinned to Node 18, which crashes
      # mocha's CLI with ERR_REQUIRE_ESM before any test runs.
      matrix:
        node-version: [22.x]

    steps:
      - uses: getong/mariadb-action@v1.11
        with:
          host port: 3306
          container port: 3306
          mariadb version: '10.7'
          mysql database: 'test'
          mysql root password: 'test'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - shell: bash
        run: |
          cat << EOF > ./config/db_test.json
          {
            "connectionLimit": 10,
            "host": "127.0.0.1",
            "port": 3306,
            "user": "root",
            "password": "test",
            "charset": "utf8mb4_general_ci",
            "supportBigNumbers": true,
            "database": "test"
          }
          EOF
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm test

  publish:
    if: github.ref == 'refs/heads/master'
    needs: test
    uses: larvit/standards/.github/workflows/publish.yml@master
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
